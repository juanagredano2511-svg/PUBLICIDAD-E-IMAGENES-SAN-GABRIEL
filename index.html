<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Prueba - Juan Pavo</title>
    <style>
        /* Estilos diseñados por el cerebrito de 1° de secundaria */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Fondo oscuro estilo GitHub */
            color: #c9d1d9;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            background-color: #161b22;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #30363d;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #8b949e;
            line-height: 1.6;
        }
        .boton-whatsapp {
            background-color: #25D366; /* Verde oficial de WhatsApp */
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
            margin-top: 25px;
            margin-bottom: 25px;
            box-shadow: 0px 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s;
        }
        .boton-whatsapp:hover {
            transform: scale(1.05);
        }
        .footer {
            font-size: 12px;
            color: #8b949e;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>¡Mi Primera Página Web! 🚀</h1>
        <p>Esta es una página web de prueba real corriendo en los servidores de GitHub.</p>
        <p>Creada por el experto en tecnología de 1° de secundaria.</p>
        
        <!-- BOTÓN CON LINK DIRECTO A TU WHATSAPP -->
        <!-- Nota para el programador: Recuerda cambiar las X por tu número de 10 dígitos -->
        <a href="https://wa.me" class="boton-whatsapp" target="_blank">
            💬 Mandar mensaje por WhatsApp
        </a>

        <div class="footer">
            <p>Hecho con HTML y CSS en GitHub 💻</p>
        </div>
    </div>

</body>
</html>
